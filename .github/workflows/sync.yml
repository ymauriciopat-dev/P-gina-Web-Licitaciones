name: Sincronización horaria de SECOP

on:
  schedule:
    - cron: '0 * * * *'   # opcional, cada hora
  workflow_dispatch:      # botón manual

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la API de sincronización
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.DETECTA_CRON_SECRET }}" \
            "${{ secrets.DETECTA_URL }}/api/sync?modo=full")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"done":true'
